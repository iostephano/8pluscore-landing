<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Esta dirección no existe, 8+Core</title>
  <meta name="description" content="Esta dirección no existe.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F5F3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- Estilos en línea y rutas absolutas: esta página se sirve desde cualquier dirección inexistente. -->
  <style>
    :root {
      --ink: #0A0A0F;
      --paper: #F6F5F3;
      --violet: #6B2CF5;

      --font: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --font-brand: "Poppins", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 6px; }
    .header { padding: 28px 20px; font-family: var(--font-brand); }
    .brand-name { font-size: 22px; font-weight: 600; letter-spacing: -0.04em; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 20px 96px; }
    h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.08; }
    .btn {
      display: inline-block;
      margin-top: 32px;
      min-height: 48px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .btn:hover { background: var(--violet); }
    @media (min-width: 768px) { .header { padding: 28px 40px; } main { padding-top: 56px; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="brand-name">8+Core</a>
  </header>
  <main>
    <h1>Esta dirección no existe</h1>
    <a class="btn" href="/">Ir al inicio</a>
  </main>
</body>
</html>
